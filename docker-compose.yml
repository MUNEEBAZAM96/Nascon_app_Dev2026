x-backend-env: &backend-env
  DAY1_SALT: ${DAY1_SALT}
  DAY2_SALT: ${DAY2_SALT}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
  DATABASE_URL: postgres://sideline:sideline@postgres:5432/sideline
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: sideline
  MINIO_SECRET_KEY: sideline-secret
  MINIO_BUCKET: receipts
  PORT: "8080"
  MEDIA_HEALTH_URL: http://media:8888/

# Grid browsers (Slice 12) reach the API on the host at http://host.docker.internal:8080
x-selenium-node: &selenium-node
  shm_size: "1gb"
  depends_on:
    - selenium-hub
  environment:
    SE_EVENT_BUS_HOST: selenium-hub
    SE_EVENT_BUS_PUBLISH_PORT: "4442"
    SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
    SE_START_VNC: "false"
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sideline
      POSTGRES_USER: sideline
      POSTGRES_PASSWORD: sideline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sideline -d sideline"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  media:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8888/ >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # minio/minio is no longer pullable from Docker Hub; Chainguard publishes the same open-source server.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sideline
      MINIO_ROOT_PASSWORD: sideline-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: ./backend
    command: ["node", "dist/index.js"]
    environment: *backend-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      media:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  selenium-hub:
    image: seleniarm/hub:latest
    ports:
      - "4444:4444"

  chrome-node-1:
    <<: *selenium-node
    image: seleniarm/node-chromium:latest

  chrome-node-2:
    <<: *selenium-node
    image: seleniarm/node-chromium:latest

  firefox-node:
    <<: *selenium-node
    image: seleniarm/node-firefox:latest

volumes:
  pgdata:
  miniodata:
